<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder</title>

<style>
* {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
}

body {
 font-family: Roboto, "Arial", sans-serif;
 background: #111318;
 color: #f0f0f5;
 min-height: 100vh;
}

.app {
 max-width: 480px;
 min-height: 100vh;
 margin: auto;
 padding: 25px 22px;
 background: #191b22;
}

header {
 display: flex;
 align-items: center;
 justify-content: space-between;
 margin-bottom: 45px;
}

header h1 {
 font-size: 23px;
 font-weight: 600;
}

header span {
 color: #c5b8ff;
 font-size: 25px;
}

.subtitle {
 color: #aaa9b4;
 font-size: 14px;
 margin-bottom: 40px;
}

.timer {
 text-align: center;
 font-size: 55px;
 font-weight: 300;
 letter-spacing: 3px;
 margin: 30px 0 15px;
 font-variant-numeric: tabular-nums;
}

.status {
 text-align: center;
 color: #aaa9b4;
 font-size: 14px;
}

.wave-container {
 height: 120px;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 4px;
 margin: 35px 0;
 overflow: hidden;
}

.bar {
 width: 4px;
 height: 10px;
 border-radius: 10px;
 background: #b9a8ff;
 transition: height 0.1s;
}

.controls {
 display: flex;
 justify-content: center;
 align-items: center;
 gap: 25px;
 margin: 35px 0 50px;
}

.control {
 border: none;
 border-radius: 50%;
 cursor: pointer;
 display: flex;
 align-items: center;
 justify-content: center;
 transition: .2s;
}

.secondary {
 width: 58px;
 height: 58px;
 background: #30323b;
 color: white;
 font-size: 22px;
}

.record {
 width: 82px;
 height: 82px;
 background: #c7b7ff;
 color: #29213e;
 font-size: 28px;
}

.control:active {
 transform: scale(.92);
}

.record.recording {
 background: #ff8b9b;
}

.section-title {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 18px;
}

.section-title h2 {
 font-size: 19px;
}

.section-title span {
 color: #b9a8ff;
 font-size: 13px;
}

.recordings {
 display: flex;
 flex-direction: column;
 gap: 12px;
}

.recording-item {
 background: #292b34;
 padding: 16px;
 border-radius: 18px;
 display: flex;
 align-items: center;
 gap: 12px;
}

.recording-icon {
 background: #413b56;
 color: #c7b7ff;
 border-radius: 14px;
 width: 45px;
 height: 45px;
 display: grid;
 place-items: center;
 font-size: 20px;
}

.recording-info {
 flex: 1;
 min-width: 0;
}

.recording-info h3 {
 font-size: 14px;
 margin-bottom: 5px;
 overflow: hidden;
 text-overflow: ellipsis;
}

.recording-info p {
 color: #aaa9b4;
 font-size: 12px;
}

.item-actions {
 display: flex;
 gap: 8px;
}

.item-actions button {
 background: transparent;
 border: none;
 color: #c7b7ff;
 font-size: 19px;
 cursor: pointer;
}

.empty {
 text-align: center;
 padding: 35px 10px;
 color: #898994;
 font-size: 14px;
}

.footer {
 text-align: center;
 color: #777781;
 font-size: 11px;
 margin-top: 40px;
}

@media (max-width: 360px) {
 .timer {
 font-size: 44px;
 }
}
</style>
</head>

<body>

<div class="app">

<header>
 <h1>Voice Recorder</h1>
 <span>😄</span>
</header>

<p class="subtitle">Quinten ́s Audio opneem dingetje voor ChromeOS.</p>

<div class="timer" id="timer">00:00:00</div>
<p class="status" id="status">Startklaar</p>

<div class="wave-container" id="wave"></div>

<div class="controls">

 <button class="control secondary"
 id="pauseBtn"
 onclick="togglePause()"
 title="Pause or resume"
 disabled>
 ⏸
 </button>

 <button class="control record"
 id="recordBtn"
 onclick="toggleRecording()">
 ●
 </button>

 <button class="control secondary"
 onclick="stopRecording()"
 title="Stop recording">
 ■
 </button>

</div>

<div class="section-title">
 <h2>Uw opnames gemaakt met Q ́s site</h2>
 <span id="count">0 opnames</span>
</div>

<div class="recordings" id="recordings">
 <div class="empty">Opnames verschijnen hier.</div>
</div>

<div class="footer">
 Gemaakt door Q · Audio opneem dingetje voor ChromeOS en andere bestruingssystemen zonder ingebouwde app
</div>

</div>

}
